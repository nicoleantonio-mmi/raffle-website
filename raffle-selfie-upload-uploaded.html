<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter Scratch Code | Raffle Website</title>
    <link rel="stylesheet" href="style.css" />
    <script src="/script.js" defer></script>
  </head>
  <body>
    <header class="topnav">
      <div class="wrapper topnav__wrapper">
        <a href="/index.html" class="topnav__homelink">
          <img
            src="/images/jti__logo.svg"
            alt="JTI homepage"
            class="topnav__logo"
            width="67"
            height="48"
          />
        </a>

        <nav>
          <ul class="topnav__links">
            <li class="topnav__item">
              <a href="" class="topnav__link">Mechanics</a>
            </li>
            <li class="topnav__item">
              <a href="" class="topnav__link button cta-secondary">Login</a>
            </li>
            <li class="topnav__item">
              <a href="" class="topnav__link button cta-primary">Join Now</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="raffle-submission background__image">
        <div class="wrapper rs__wrapper">
          <h1 class="hero__title heading stroke__gradient">
            Buy, Scan, And
            <span class="heading style__italic color__yellow stroke__gradient"
              >Win</span
            >
          </h1>

          <form action="" class="form" method="">
            <h3 class="form__title">Selfie with Products</h3>
            <p class="form__description">
              Please upload a selfie of you holding your purchased items.
            </p>
            <div class="form__file-uploaders">
              <div class="fu__uploaded-file">
                <div class="file-uploader">
                  <img
                    src="/images/img_uploader_ID.png"
                    alt=""
                    class="fu__image"
                    width="500"
                    height="500"
                  />
                  <label for="mobile__number" class="fu__label"
                    >Government ID</label
                  >
                  <button class="fu__button button secondary">Browse</button>
                </div>
                <button class="fu__btn-change button overlay">
                  <img
                    src="/images/ic_fileuploader_photo.svg"
                    alt=""
                    width="24"
                    height="24"
                    class="fu__btn-icon"
                  />
                  <p class="small">Change Photo</p>
                </button>
              </div>
            </div>
            <button class="form__button button primary" value="submit">
              Send Code
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="wrapper footer__wrapper">
        <div class="footer__top">
          <a href="" class="footer__homelink">
            <img
              src="/images/jti__logo-light.svg"
              alt="JTI homepage"
              class="footer__logo"
              width="67"
              height="48"
            />
          </a>

          <div class="footer__quicklinks">
            <ul class="footer__links">
              <li class="footer__item">
                <a href="" class="footer__link">Home</a>
              </li>
              <li class="footer__item">
                <a href="" class="footer__link">Promo Mechanics</a>
              </li>
              <li class="footer__item">
                <a href="" class="footer__link">Sign Up</a>
              </li>
              <li class="footer__item">
                <a href="" class="footer__link">JTi Website</a>
              </li>
            </ul>
          </div>
        </div>
        <div class="footer__bottom">
          <p class="footer__copyright">All Rights Reserved.</p>
          <div class="footer__quicklinks">
            <ul class="footer__links">
              <li class="footer__item">
                <a href="" class="footer__link">Terms and Conditions</a>
              </li>
              <li class="footer__item">
                <a href="" class="footer__link">Privacy Policy</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
