<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Raffle Website</title>
    <link rel="stylesheet" href="style.css" />
    <script src="/script.js" defer></script>
  </head>
  <body>
    <header class="topnav">
      <div class="wrapper topnav__wrapper">
        <a href="/index.html" class="topnav__homelink">
          <img
            src="/images/jti__logo.svg"
            alt="JTI homepage"
            class="topnav__logo"
            width="67"
            height="48"
          />
        </a>

        <nav>
          <ul class="topnav__links">
            <li class="topnav__item">
              <a href="" class="topnav__link">Mechanics</a>
            </li>
            <li class="topnav__item">
              <a href="" class="topnav__link button cta-secondary">Login</a>
            </li>
            <li class="topnav__item">
              <a href="" class="topnav__link button cta-primary">Join Now</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="entry background__image">
        <div class="wrapper entry__wrapper">
          <h1 class="entry__title heading stroke__gradient">
            Buy, Scan, And
            <span class="heading style__italic color__yellow stroke__gradient"
              >Win</span
            >
          </h1>

          <div class="entry__content">
            <div class="hero__brands">
              <img
                class="hero__brand-image"
                src="/images/img_winston.png"
                alt=""
                width="88"
                height="50"
              />
              <img
                class="hero__brand-image"
                src="/images/img_camel.png"
                alt=""
                width="99"
                height="56"
              />
              <img
                class="hero__brand-image"
                src="/images/img_mighty.png"
                alt=""
                width="95"
                height="15"
              />
            </div>
            <form action="" class="entry__form" method="">
              <h3 class="form__title">Login</h3>
              <p class="form__description">
                Please enter your registered mobile number.
              </p>

              <div class="form__input-field">
                <label for="mobile__number" class="form__label"
                  >Mobile Number</label
                >
                <input
                  type="text"
                  name="mobile__number"
                  id="mobile__number"
                  class="form__input"
                  placeholder="Mobile Number"
                  inputmode="numeric"
                  maxlength="11"
                />
              </div>

              <button class="form__button button primary" value="submit">
                Send Code
              </button>
              <div class="form__footer">
                <p class="form__footer-text">Don't have an account?</p>
                <a href="/" class="form__footer-link">Sign up here</a>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="wrapper footer__wrapper">
        <div class="footer__top">
          <a href="" class="footer__homelink">
            <img
              src="/images/jti__logo-light.svg"
              alt="JTI homepage"
              class="footer__logo"
              width="67"
              height="48"
            />
          </a>

          <div class="footer__quicklinks">
            <ul class="footer__links">
              <li class="footer__item">
                <a href="" class="footer__link">Home</a>
              </li>
              <li class="footer__item">
                <a href="" class="footer__link">Promo Mechanics</a>
              </li>
              <li class="footer__item">
                <a href="" class="footer__link">Sign Up</a>
              </li>
              <li class="footer__item">
                <a href="" class="footer__link">JTi Website</a>
              </li>
            </ul>
          </div>
        </div>
        <div class="footer__bottom">
          <p class="footer__copyright">All Rights Reserved.</p>
          <div class="footer__quicklinks">
            <ul class="footer__links">
              <li class="footer__item">
                <a href="" class="footer__link">Terms and Conditions</a>
              </li>
              <li class="footer__item">
                <a href="" class="footer__link">Privacy Policy</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
