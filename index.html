<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buy, Scan and Win! | JTI</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/script.js" defer></script>
  </head>
  <body>
    <header class="topnav">
      <div class="wrapper topnav__wrapper">
        <a href="/" class="topnav__homelink">
          <img
            src="/images/jti__logo.svg"
            alt="JTI homepage"
            class="topnav__logo"
            width="67"
            height="48"
          />
        </a>

        <nav class="topnav__links">
          <li class="topnav__item">
            <a href="" class="topnav__link">Mechanics</a>
          </li>
          <li class="topnav__item">
            <a href="" class="topnav__link button cta-secondary">Login</a>
          </li>
          <li class="topnav__item">
            <a href="" class="topnav__link button cta-primary">Join Now</a>
          </li>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="wrapper hero__wrapper">
          <img
            src="/images/img_hero.png"
            alt=""
            class="hero__image"
            width="811"
            height="526"
          />

          <div class="hero__heading">
            <h2>Buy, Scan, And</h2>
            <h1>Win</h1>
          </div>

          <div class="hero__subheading">
            <h2>Get a chance to win</h2>
            <h1>Amazing prices</h1>
          </div>

          <div class="hero__brands">
            <img
              class="hero__brand-image"
              src="/images/img_winston.png"
              alt=""
            />
            <img class="hero__brand-image" src="/images/img_camel.png" alt="" />
            <img
              class="hero__brand-image"
              src="/images/img_mighty.png"
              alt=""
            />
          </div>

          <p>
            Open only to participants who are 18 years old and above. Terms and
            conditions apply.
          </p>

          <div class="hero__buttons">
            <a href="" class="button cta-secondary">View Raffle Coupons</a>
            <a href="" class="button cta-primary">Submit Raffle Entry</a>
          </div>
        </div>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
